<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Bio Generator | Prosperity Pact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .brand-font { font-family: 'Berkshire Swash', cursive; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 0.8s linear infinite; }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { screens: { 'xs': '475px' } } } }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [screen, setScreen] = useState('intro');
            const [currentBio, setCurrentBio] = useState('');
            const [q1, setQ1] = useState('');
            const [q2, setQ2] = useState('');
            const [q3, setQ3] = useState('');
            const [q4, setQ4] = useState('');
            const [word1, setWord1] = useState('');
            const [word2, setWord2] = useState('');
            const [word3, setWord3] = useState('');
            const [results, setResults] = useState(null);
            const [error, setError] = useState('');
            const [loadingMsg, setLoadingMsg] = useState('Reading between the lines...');
            const [copiedIdx, setCopiedIdx] = useState(null);

            const msgs = ['Reading between the lines...','Finding the real you in there...','Translating human into bio...','Almost there...'];
            const progressMap = { intro:0, q1:15, q2:35, q3:55, q4:75, loading:90, results:100 };

            const goTo = (s) => { setError(''); setScreen(s); setTimeout(() => window.scrollTo({top:0,behavior:'smooth'}),0); };

            const generate = async () => {
                if (!q1.trim() || !q4.trim()) { setError('Please answer at least questions 1 and 4.'); return; }
                goTo('loading');
                let idx = 0;
                const iv = setInterval(() => { idx=(idx+1)%msgs.length; setLoadingMsg(msgs[idx]); }, 2200);
                const mw = [word1,word2,word3].filter(Boolean).join(', ');
                const prompt = `You are a professional copywriter for heart-led creators, soul-driven mentors, and healers. Warm, direct, a little irreverent, never corporate.

Write 3 distinct bio options. Each must be 150 characters or fewer. Sound like a real human said it.

RULES:
- No "I help X to Y without Z" formula. Ever.
- No credential-listing.
- Show identity, philosophy, or worldview.
- Conversational, like a dinner table intro.
- Three angles: identity-led, belief-led, contrarian voice.
- Strictly under 150 characters each.

INPUTS:
Who they help and what changes: ${q1}
How people describe them: ${q2||'Not provided'}
What they reject and believe instead: ${q3||'Not provided'}
What they actually do (their words): ${q4}
${mw?'Three Magnetic Words: '+mw:''}
${currentBio?'Current bio (do NOT copy): '+currentBio:''}

Respond ONLY in this exact JSON:
{"variants":[{"label":"Identity-led","bio":"...","angle":"..."},{"label":"Belief-led","bio":"...","angle":"..."},{"label":"Contrarian voice","bio":"...","angle":"..."}]}`;

                try {
                    const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
                    clearInterval(iv);
                    const data = await res.json();
                    const raw = data.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim();
                    setResults(JSON.parse(raw).variants);
                    goTo('results');
                } catch(e) { clearInterval(iv); setError('Something went wrong. Try again.'); goTo('q4'); }
            };

            const copy = (text, i) => { navigator.clipboard.writeText(text).then(()=>{ setCopiedIdx(i); setTimeout(()=>setCopiedIdx(null),2000); }); };

            const Header = () => (
                <div className="fixed top-0 left-0 right-0 z-50 border-b border-gray-800" style={{backdropFilter:'blur(10px)',backgroundColor:'rgba(0,0,0,0.9)'}}>
                    <div className="max-w-6xl mx-auto px-3 md:px-4 py-2 md:py-3 flex items-center justify-between">
                        <span className="brand-font text-base md:text-xl" style={{color:'#f42ba6'}}>
                            <span className="hidden xs:inline">Prosperity Pact</span>
                            <span className="xs:hidden">PP</span>
                        </span>
                        <a href="https://www.skool.com/prosperity-pact" target="_blank" rel="noopener noreferrer"
                            className="px-3 py-1.5 md:px-4 md:py-2 rounded-full text-xs md:text-sm font-bold transition-all hover:scale-105 whitespace-nowrap"
                            style={{backgroundColor:'#c1ff72',color:'black'}}>
                            Join <span className="hidden sm:inline">Prosperity Pact</span><span className="sm:hidden">PP</span> Skool
                        </a>
                    </div>
                    {screen!=='intro' && (
                        <div className="h-1 bg-gray-800">
                            <div className="h-full transition-all duration-500" style={{width:`${progressMap[screen]||0}%`,background:'linear-gradient(to right,#c1ff72,#f42ba6,#2cb8b0)'}}/>
                        </div>
                    )}
                </div>
            );

            const Footer = () => (
                <div className="text-center mt-8 pb-4">
                    <p className="brand-font text-2xl mb-1" style={{color:'#f42ba6'}}>Prosperity Pact</p>
                    <p className="text-sm text-gray-400">by <a href="https://laubrizuela.com" target="_blank" rel="noopener noreferrer" className="font-bold underline hover:no-underline" style={{color:'#f42ba6'}}>Lau Brizuela</a></p>
                    <p className="text-xs text-gray-500 mt-1">Spiritual Business & Rebel Manifestation Mentor</p>
                    <p className="text-xs text-gray-600 mt-2">© 2026 Lau Brizuela · All rights reserved</p>
                </div>
            );

            const ta = (val,set,ph,rows=4) => (
                <textarea value={val} onChange={e=>set(e.target.value)} rows={rows} placeholder={ph}
                    className="w-full bg-gray-800 border border-gray-700 rounded-xl text-white text-sm md:text-base p-4 resize-none outline-none focus:border-pink-500 transition-colors placeholder-gray-600"
                    style={{fontFamily:'Poppins,sans-serif'}}/>
            );

            if (screen==='intro') return (<>
                <Header/>
                <div className="min-h-screen bg-gradient-to-br from-black via-gray-900 to-black flex items-center justify-center p-4 pt-20">
                    <div className="max-w-2xl w-full text-center">
                        <p className="text-xs font-semibold tracking-widest uppercase mb-5" style={{color:'#c1ff72'}}>Soul Brand Essentials</p>
                        <h1 className="text-4xl md:text-5xl font-bold mb-5 leading-tight">
                            <span className="text-white">Your bio is making<br/>you </span>
                            <span style={{color:'#f42ba6'}}>invisible.</span>
                        </h1>
                        <p className="text-lg text-gray-300 mb-10 max-w-xl mx-auto leading-relaxed">
                            Most heart-led creators, soul-driven mentors, and healers spend years honing their gifts and five minutes writing a bio that sounds like everyone else's. This changes today.
                        </p>
                        <div className="bg-gray-900 rounded-2xl p-6 mb-10 text-left border border-gray-800 max-w-xl mx-auto">
                            <p className="text-xs font-semibold tracking-widest uppercase mb-3" style={{color:'#f42ba6'}}>What happens here</p>
                            <p className="text-gray-300 text-base leading-relaxed">You'll answer 4 simple questions about who you are and what you believe. No formulas, no "I help X to Y without Z." Just you, your voice, and a bio that actually sounds like a real human wrote it. Because one did.</p>
                        </div>
                        <button onClick={()=>goTo('q1')} className="px-10 py-4 rounded-full font-bold text-lg text-black transition-all transform hover:scale-105 shadow-lg" style={{backgroundColor:'#c1ff72'}}>
                            Let's fix this bio ✦
                        </button>
                        <div className="mt-12"><Footer/></div>
                    </div>
                </div>
            </>);

            if (screen==='q1') return (<>
                <Header/>
                <div className="min-h-screen bg-gradient-to-br from-black via-gray-900 to-black pt-24 pb-8 px-4 flex items-center justify-center">
                    <div className="max-w-2xl w-full">
                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 shadow-2xl border border-gray-700">
                            <p className="text-xs font-semibold tracking-widest uppercase mb-2" style={{color:'#f42ba6'}}>Before we begin</p>
                            <h2 className="text-xl md:text-2xl font-bold text-white mb-2">What does your bio say right now?</h2>
                            <p className="text-gray-400 text-sm mb-5">Paste it here. If you don't have one yet, skip this and move on. No shame either way.</p>
                            {ta(currentBio,setCurrentBio,'Paste your current bio here...',3)}
                            <div className="flex justify-between items-center mt-8 pt-6 border-t border-gray-700">
                                <button onClick={()=>goTo('intro')} className="flex items-center px-6 py-3 rounded-full font-bold text-white" style={{backgroundColor:'#2cb8b0'}}>
                                    <svg className="mr-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>Back
                                </button>
                                <div className="flex gap-3">
                                    {!currentBio.trim() && <button onClick={()=>goTo('q2')} className="px-5 py-3 rounded-full font-bold text-sm text-gray-400 hover:text-white transition-all">Skip →</button>}
                                    <button onClick={()=>goTo('q2')} className="flex items-center px-6 py-3 rounded-full font-bold text-white hover:scale-105 transition-all transform" style={{backgroundColor:'#f42ba6',boxShadow:'0 10px 30px rgba(244,43,166,0.4)'}}>
                                        Next<svg className="ml-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div className="mt-8"><Footer/></div>
                    </div>
                </div>
            </>);

            if (screen==='q2') return (<>
                <Header/>
                <div className="min-h-screen bg-gradient-to-br from-black via-gray-900 to-black pt-24 pb-8 px-4 flex items-center justify-center">
                    <div className="max-w-2xl w-full">
                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 shadow-2xl border border-gray-700">
                            <p className="text-xs font-semibold tracking-widest uppercase mb-2" style={{color:'#f42ba6'}}>Question 1 of 4</p>
                            <h2 className="text-xl md:text-2xl font-bold text-white mb-2">Who do you help, and what actually changes for them?</h2>
                            <p className="text-gray-400 text-sm mb-5">Not the textbook version. How would you describe it at a dinner table to someone who's never heard of what you do?</p>
                            {ta(q1,setQ1,'I work with healers who are exhausted from overgiving. What changes is they finally start building a practice that doesn\'t cost them their soul...',4)}
                            {error && <p className="text-sm mt-3 px-4 py-3 rounded-xl bg-pink-900 bg-opacity-30 border border-pink-800 text-pink-300">{error}</p>}
                            <div className="flex justify-between items-center mt-8 pt-6 border-t border-gray-700">
                                <button onClick={()=>goTo('q1')} className="flex items-center px-6 py-3 rounded-full font-bold text-white" style={{backgroundColor:'#2cb8b0'}}>
                                    <svg className="mr-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>Back
                                </button>
                                <button onClick={()=>q1.trim()?goTo('q3'):setError('Please answer this question to continue.')} className={`flex items-center px-6 py-3 rounded-full font-bold transition-all transform ${!q1.trim()?'bg-gray-800 text-gray-600 cursor-not-allowed':'hover:scale-105 text-white'}`} style={q1.trim()?{backgroundColor:'#f42ba6',boxShadow:'0 10px 30px rgba(244,43,166,0.4)'}:{}}>
                                    Next<svg className="ml-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                                </button>
                            </div>
                        </div>
                        <div className="mt-8"><Footer/></div>
                    </div>
                </div>
            </>);

            if (screen==='q3') return (<>
                <Header/>
                <div className="min-h-screen bg-gradient-to-br from-black via-gray-900 to-black pt-24 pb-8 px-4 flex items-center justify-center">
                    <div className="max-w-2xl w-full">
                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 shadow-2xl border border-gray-700">
                            <p className="text-xs font-semibold tracking-widest uppercase mb-2" style={{color:'#f42ba6'}}>Question 2 of 4</p>
                            <h2 className="text-xl md:text-2xl font-bold text-white mb-2">When someone describes you to a friend, what words do they use?</h2>
                            <p className="text-gray-400 text-sm mb-5">Think about what people actually say. "She's so..." or "He's the kind of person who..." Bonus points for real quotes.</p>
                            {ta(q2,setQ2,'They usually say I\'m real, a little intense in the best way, like talking to someone who just cuts through the noise...',4)}
                            <div className="flex justify-between items-center mt-8 pt-6 border-t border-gray-700">
                                <button onClick={()=>goTo('q2')} className="flex items-center px-6 py-3 rounded-full font-bold text-white" style={{backgroundColor:'#2cb8b0'}}>
                                    <svg className="mr-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>Back
                                </button>
                                <div className="flex gap-3">
                                    {!q2.trim() && <button onClick={()=>goTo('q4')} className="px-5 py-3 rounded-full font-bold text-sm text-gray-400 hover:text-white transition-all">Skip →</button>}
                                    <button onClick={()=>goTo('q4')} className="flex items-center px-6 py-3 rounded-full font-bold text-white hover:scale-105 transition-all transform" style={{backgroundColor:'#f42ba6',boxShadow:'0 10px 30px rgba(244,43,166,0.4)'}}>
                                        Next<svg className="ml-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div className="mt-8"><Footer/></div>
                    </div>
                </div>
            </>);

            if (screen==='q4') return (<>
                <Header/>
                <div className="min-h-screen bg-gradient-to-br from-black via-gray-900 to-black pt-24 pb-8 px-4 flex items-center justify-center">
                    <div className="max-w-2xl w-full">
                        <div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 shadow-2xl border border-gray-700 space-y-6">
                            <div>
                                <p className="text-xs font-semibold tracking-widest uppercase mb-2" style={{color:'#f42ba6'}}>Question 3 of 4</p>
                                <h2 className="text-xl md:text-2xl font-bold text-white mb-2">What do you refuse to do the way everyone else does it, and what do you believe instead?</h2>
                                <p className="text-gray-400 text-sm mb-4">Your contrarian side is where the magic is. The "I don't care what the gurus say, I do it this way" part.</p>
                                {ta(q3,setQ3,'I refuse to teach people to sell through manipulation or fake urgency. I believe you can build a full practice just by being deeply yourself...',4)}
                            </div>
                            <div className="border-t border-gray-700 pt-6">
                                <p className="text-xs font-semibold tracking-widest uppercase mb-2" style={{color:'#f42ba6'}}>Question 4 of 4</p>
                                <h2 className="text-xl md:text-2xl font-bold text-white mb-2">Complete this out loud, like you're at a party:</h2>
                                <p className="text-gray-400 text-sm mb-4">"What I actually do is..."</p>
                                {ta(q4,setQ4,'What I actually do is help spiritual women stop apologizing for wanting to be paid well...',4)}
                            </div>
                            <div className="border-t border-gray-700 pt-6">
                                <p className="text-xs font-semibold tracking-widest uppercase mb-1" style={{color:'#2cb8b0'}}>Three Magnetic Words <span className="normal-case font-normal tracking-normal text-gray-500 text-xs">(optional)</span></p>
                                <p className="text-gray-400 text-sm mb-4">If you've done this exercise, add them here — they'll sharpen the result.</p>
                                <div className="grid grid-cols-3 gap-3">
                                    {[[word1,setWord1],[word2,setWord2],[word3,setWord3]].map(([v,s],i)=>(
                                        <input key={i} type="text" value={v} onChange={e=>s(e.target.value)} placeholder={`Word ${i+1}`} maxLength={20}
                                            className="bg-gray-800 border border-gray-700 rounded-xl text-white text-sm p-3 outline-none focus:border-pink-500 transition-colors text-center placeholder-gray-600"
                                            style={{fontFamily:'Poppins,sans-serif'}}/>
                                    ))}
                                </div>
                            </div>
                            {error && <p className="text-sm px-4 py-3 rounded-xl bg-pink-900 bg-opacity-30 border border-pink-800 text-pink-300">{error}</p>}
                            <div className="flex justify-between items-center pt-6 border-t border-gray-700">
                                <button onClick={()=>goTo('q3')} className="flex items-center px-6 py-3 rounded-full font-bold text-white" style={{backgroundColor:'#2cb8b0'}}>
                                    <svg className="mr-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"/></svg>Back
                                </button>
                                <button onClick={generate} className="flex items-center px-6 py-3 rounded-full font-bold text-white hover:scale-105 transition-all transform" style={{backgroundColor:'#f42ba6',boxShadow:'0 10px 30px rgba(244,43,166,0.4)'}}>
                                    Generate my bio ✦<svg className="ml-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                                </button>
                            </div>
                        </div>
                        <div className="mt-8"><Footer/></div>
                    </div>
                </div>
            </>);

            if (screen==='loading') return (<>
                <Header/>
                <div className="min-h-screen bg-gradient-to-br from-black via-gray-900 to-black flex items-center justify-center p-4 pt-20">
                    <div className="text-center">
                        <div className="w-12 h-12 rounded-full border-2 border-gray-700 border-t-pink-500 animate-spin mx-auto mb-6" style={{borderTopColor:'#f42ba6'}}></div>
                        <p className="text-xl text-gray-300 italic">{loadingMsg}</p>
                    </div>
                </div>
            </>);

            if (screen==='results' && results) return (<>
                <Header/>
                <div className="min-h-screen bg-gradient-to-br from-black via-gray-900 to-black pt-20 pb-8 px-4 flex items-center justify-center">
                    <div className="max-w-2xl w-full">
                        <div className="text-center mb-8 pt-4">
                            <p className="text-xs font-semibold tracking-widest uppercase mb-3" style={{color:'#c1ff72'}}>Your new bio options</p>
                            <h1 className="text-3xl md:text-4xl font-bold text-white mb-3">These sound more like <span style={{color:'#f42ba6'}}>you.</span></h1>
                            <p className="text-gray-400 text-sm">Three versions, three angles. Copy the one that hits closest, then tweak until it's perfectly yours.</p>
                        </div>
                        <div className="space-y-4 mb-6">
                            {results.map((v,i)=>(
                                <div key={i} className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-6 border border-gray-700 hover:border-gray-500 transition-all">
                                    <div className="flex items-start justify-between mb-3">
                                        <p className="text-xs font-semibold tracking-widest uppercase" style={{color:'#2cb8b0'}}>{v.label}</p>
                                        <button onClick={()=>copy(v.bio,i)} className="text-xs px-3 py-1 rounded-full border border-gray-600 text-gray-400 hover:text-white hover:border-gray-400 transition-all" style={copiedIdx===i?{color:'#c1ff72',borderColor:'#c1ff72'}:{}}>
                                            {copiedIdx===i?'Copied ✓':'Copy'}
                                        </button>
                                    </div>
                                    <p className="text-white text-base md:text-lg leading-relaxed mb-3">{v.bio}</p>
                                    <div className="flex items-center justify-between">
                                        <p className="text-gray-500 text-xs italic">{v.angle}</p>
                                        <span className="text-xs bg-gray-800 text-gray-500 rounded-full px-3 py-1">{v.bio.length} chars</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="bg-gray-900 rounded-2xl p-6 border border-gray-800 mb-6">
                            <p className="text-sm text-gray-300 leading-relaxed"><span style={{color:'#2cb8b0',fontWeight:600}}>Quick gut check:</span> Read your chosen bio out loud. Does it sound like you talking at a dinner party, or like a marketing course taught you? If it sounds generic, tweak it. If it sounds real, you're done.</p>
                        </div>
                        <div className="rounded-2xl p-6 border mb-8 text-center" style={{background:'linear-gradient(135deg,rgba(44,184,176,0.08),rgba(193,255,114,0.05))',borderColor:'rgba(193,255,114,0.2)'}}>
                            <p className="font-bold text-lg mb-2" style={{color:'#c1ff72'}}>Up Next: Your Brand Colors 🎨</p>
                            <p className="text-gray-400 text-sm">Your bio is just the beginning. Next we'll find 2-3 colors that match your energy and make you instantly recognizable.</p>
                        </div>
                        <div className="text-center mb-6">
                            <button onClick={()=>{setScreen('intro');setResults(null);setQ1('');setQ2('');setQ3('');setQ4('');setCurrentBio('');setWord1('');setWord2('');setWord3('');}}
                                className="px-8 py-3 rounded-full font-bold text-black transition-all hover:scale-105" style={{backgroundColor:'#2cb8b0'}}>
                                Start over with a new bio
                            </button>
                        </div>
                        <Footer/>
                    </div>
                </div>
            </>);

            return null;
        };

        ReactDOM.render(<App/>, document.getElementById('root'));
    </script>
</body>
</html>
